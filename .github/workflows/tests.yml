name: Refund Desk tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile app.py test_smoke.py
      - name: Run smoke tests
        env:
          SECRET_KEY: ci-test-secret
          DEMO_MODE: "true"
        run: python -m unittest -v test_smoke.py
