{% extends 'base.html' %}{% block title %}New request{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">NEW WORK ITEM</div><h1>Submit refund request</h1><p class="muted">Add the details accounts needs to verify and process the refund.</p></div><a class="btn btn-ghost" href="{{ url_for('dashboard') }}">← Back to queue</a></div><form class="panel form-panel" method="post" enctype="multipart/form-data"><h3>Customer and vehicle</h3><div class="form-grid"><label>Customer name *<input name="customer_name" required></label><label>Customer code<input name="customer_code" maxlength="80" placeholder="Enter customer code"></label><label>Booking / order number<input name="booking_no"></label><label>VIN / chassis number<input name="vin"></label></div><hr><h3>Refund details</h3><div class="form-grid"><label>Refund type *<select name="refund_type" required><option value="">Choose type</option><option>Booking amount refund</option><option>Excess ledger balance</option><option>Other customer refund</option></select></label><label>Requested amount (₹) *<input name="requested_amount" type="number" min="0.01" step="0.01" required></label><label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></label><label>Bank name (optional)<input name="bank_name"></label><label>Account last 4 digits only (optional)<input name="account_last4" maxlength="4" pattern="[0-9]{4}" placeholder="1234"></label><label class="span-2">Reason / context *<textarea name="reason" required rows="4" placeholder="Why is the refund due? Include any relevant ledger or booking context."></textarea></label><label class="span-2">Attach email screenshot, customer request, approval or other documents<input type="file" name="attachments" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.eml,.txt"><small>PDF, images, Office documents, EML or TXT; maximum 10 MB per request.</small></label></div><div class="form-actions"><a class="btn btn-ghost" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary">Submit to accounts →</button></div></form>{% endblock %}
