services:
  - type: web
    name: dealership-refund-desk
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/refund_desk.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: PORT
        value: "8080"
    disk:
      name: refund-desk-data
      mountPath: /data
      sizeGB: 1
